<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

    <!-- ========================= -->
    <!-- Navigation Bar -->
    <!-- ========================= -->
    <header th:fragment="topbar">

        <nav class="navbar navbar-expand-lg navbar-dark stock-navbar">

            <div class="container">

                <a class="navbar-brand fw-bold" th:href="@{/}">
                    <i class="bi bi-box-seam me-2"></i>
                    STOCK SOCIETY
                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbar"
                    aria-controls="navbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <div class="collapse navbar-collapse" id="navbar">

                    <ul class="navbar-nav ms-auto align-items-lg-center">

                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/}">
                                Home
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/items}">
                                Items
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/services}">
                                Services
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/about}">
                                About
                            </a>
                        </li>

                        <li class="nav-item ms-lg-3">
                            <a class="btn btn-outline-light" th:href="@{/login}">
                                Login
                            </a>
                        </li>

                    </ul>

                </div>

            </div>

        </nav>

    </header>

    <!-- ========================= -->
    <!-- Footer -->
    <!-- ========================= -->
    <th:block th:fragment="footer">

        <footer class="footer mt-auto py-4 border-top">

            <div class="container text-center">

                <h6 class="fw-bold mb-2">
                    Stock Society Inventory Management System
                </h6>

                <p class="mb-1">
                    © 2026 Stock Society
                </p>

                <small class="text-muted">
                    Developed by
                    <strong>Princess Krish Anne Bernardino and Serena Nina Omondi</strong>
                    for
                    <strong>CPAN 228 - Java Enterprise Applications</strong>
                </small>

            </div>

        </footer>

    </th:block>

    <!-- ========================= -->
    <!-- Bootstrap Scripts -->
    <!-- ========================= -->
    <div th:fragment="scripts">

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    </div>

</body>

</html>
