<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<header th:fragment="topbar">

    <nav class="navbar navbar-expand-lg navbar-dark stock-navbar">

        <div class="container">

            <a class="navbar-brand fw-bold"
               th:href="@{/}">

                <i class="bi bi-box-seam"></i>
                STOCK SOCIETY

            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbar"
                aria-controls="navbar"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse"
                 id="navbar">

                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <li class="nav-item">

                        <a class="nav-link"
                           th:href="@{/}">
                            Home
                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                           th:href="@{/items}">
                            Items
                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                           th:href="@{/services}">
                            Services
                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                           th:href="@{/about}">
                            About
                        </a>

                    </li>

                    <li class="nav-item"
                        sec:authorize="isAnonymous()">

                        <a class="btn btn-outline-light ms-lg-3"
                        th:href="@{/login}">
                            Login
                        </a>

                    </li>

                    <li class="nav-item"
                        sec:authorize="isAnonymous()">

                        <a class="btn btn-light ms-lg-2"
                        th:href="@{/register}">
                            Register
                        </a>

                    </li>

                    <li class="nav-item dropdown ms-lg-3"
                        sec:authorize="isAuthenticated()">

                        <button
                            class="btn btn-outline-light dropdown-toggle"
                            type="button"
                            data-bs-toggle="dropdown"
                            aria-expanded="false">

                            <i class="bi bi-person-circle me-1"></i>

                            <span sec:authentication="name">
                                User
                            </span>

                        </button>

                        <ul class="dropdown-menu dropdown-menu-end">

                            <li>
                                <span class="dropdown-item-text">

                                    <small class="text-secondary d-block">
                                        Signed in as
                                    </small>

                                    <strong sec:authentication="name">
                                        user@example.com
                                    </strong>

                                    <span class="badge text-bg-light mt-2"
                                        sec:authentication="principal.role">
                                        CUSTOMER
                                    </span>

                                </span>
                            </li>

                            <li>
                                <hr class="dropdown-divider">
                            </li>

                            <li>
                                <form th:action="@{/logout}"
                                    method="post">

                                    <button
                                        type="submit"
                                        class="dropdown-item">

                                        <i class="bi bi-box-arrow-right me-2"></i>
                                        Logout

                                    </button>

                                </form>
                            </li>

                        </ul>

                    </li>

                </ul>

            </div>

        </div>

    </nav>

</header>


<footer
    th:fragment="footer"
    class="stock-footer">

    <div class="container text-center">

        <h6 class="fw-bold mb-2">
            Stock Society Inventory Management System
        </h6>

        <p class="mb-1">
            © 2026 Stock Society
        </p>

        <small class="text-muted">

            Developed by

            <strong>
                Princess Krish Anne Bernardino and Serena Nina Omondi
            </strong>

            for

            <strong>
                CPAN 228 - Java Enterprise Applications
            </strong>

        </small>

    </div>

</footer>


<div th:fragment="scripts">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</div>

</body>

</html>
