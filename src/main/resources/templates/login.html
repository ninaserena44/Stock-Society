<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Stock Society | Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link th:href="@{/css/styles.css}"
          rel="stylesheet">
</head>

<body class="login-body">

<header th:replace="~{fragments/layout :: topbar}"></header>

<main class="login-main">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-5">

                <section class="login-card">

                    <div class="text-center mb-4">

                        <div class="login-logo">
                            <i class="bi bi-box-seam"></i>
                        </div>

                        <h1 class="h2 fw-bold mt-3">
                            Welcome Back
                        </h1>

                        <p class="text-secondary">
                            Sign in to manage Stock Society inventory.
                        </p>

                    </div>

                    <div class="alert alert-success"
                        th:if="${param.registered}">
                        <i class="bi bi-check-circle me-2"></i>
                        Your account was created successfully. You can now log in.
                    </div>

                    <form th:action="@{/}"
                          method="get">

                        <div class="mb-3">

                            <label for="username"
                                   class="form-label">
                                Username
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-person"></i>
                                </span>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="username"
                                    name="username"
                                    placeholder="Enter username"
                                    required>

                            </div>

                        </div>


                        <div class="mb-3">

                            <label for="password"
                                   class="form-label">
                                Password
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-lock"></i>
                                </span>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    name="password"
                                    placeholder="Enter password"
                                    required>

                            </div>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-stock w-100 py-2 mt-2">

                            <i class="bi bi-box-arrow-in-right me-2"></i>
                            Login
                        </button>


                        <div class="text-center mt-4">
                            <span class="text-secondary">
                                Don’t have an account?
                            </span>

                            <a th:href="@{/register}"
                            class="stock-link ms-1">
                                Create an account
                            </a>
                        </div>

                    </form>

                </section>

            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
