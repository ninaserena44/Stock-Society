<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Stock Society | Register</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link th:href="@{/css/styles.css}"
          rel="stylesheet">
</head>

<body class="login-body">

<header th:replace="~{fragments/layout :: topbar}"></header>

<main class="login-main">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-9 col-lg-6">

                <section class="login-card">

                    <div class="text-center mb-4">

                        <div class="login-logo">
                            <i class="bi bi-person-plus"></i>
                        </div>

                        <h1 class="h2 fw-bold mt-3">
                            Create an Account
                        </h1>

                        <p class="text-secondary">
                            Join Stock Society to access inventory services.
                        </p>

                    </div>

                    <div class="alert alert-danger"
                         th:if="${registrationError}"
                         th:text="${registrationError}">
                    </div>

                    <form th:action="@{/register}"
                          th:object="${registrationForm}"
                          method="post">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label for="firstName"
                                       class="form-label">
                                    First Name
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="firstName"
                                       th:field="*{firstName}"
                                       placeholder="Enter first name">

                                <div class="field-error"
                                     th:if="${#fields.hasErrors('firstName')}"
                                     th:errors="*{firstName}">
                                </div>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label for="lastName"
                                       class="form-label">
                                    Last Name
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="lastName"
                                       th:field="*{lastName}"
                                       placeholder="Enter last name">

                                <div class="field-error"
                                     th:if="${#fields.hasErrors('lastName')}"
                                     th:errors="*{lastName}">
                                </div>

                            </div>

                        </div>

                        <div class="mb-3">

                            <label for="email"
                                   class="form-label">
                                Email Address
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-envelope"></i>
                                </span>

                                <input type="email"
                                       class="form-control"
                                       id="email"
                                       th:field="*{email}"
                                       placeholder="Enter email address">

                            </div>

                            <div class="field-error"
                                 th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}">
                            </div>

                        </div>

                        <div class="mb-3">

                            <label for="password"
                                   class="form-label">
                                Password
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-lock"></i>
                                </span>

                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       th:field="*{password}"
                                       placeholder="Enter password">

                            </div>

                            <div class="form-text">
                                Password must be at least 8 characters.
                            </div>

                            <div class="field-error"
                                 th:if="${#fields.hasErrors('password')}"
                                 th:errors="*{password}">
                            </div>

                        </div>

                        <div class="mb-4">

                            <label for="confirmPassword"
                                   class="form-label">
                                Confirm Password
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-shield-lock"></i>
                                </span>

                                <input type="password"
                                       class="form-control"
                                       id="confirmPassword"
                                       th:field="*{confirmPassword}"
                                       placeholder="Re-enter password">

                            </div>

                            <div class="field-error"
                                 th:if="${#fields.hasErrors('confirmPassword')}"
                                 th:errors="*{confirmPassword}">
                            </div>

                        </div>

                        <button type="submit"
                                class="btn btn-stock w-100 py-2">

                            <i class="bi bi-person-plus me-2"></i>
                            Create Account
                        </button>

                        <div class="text-center mt-4">

                            <span class="text-secondary">
                                Already have an account?
                            </span>

                            <a th:href="@{/login}"
                               class="stock-link ms-1">
                                Log in
                            </a>

                        </div>

                    </form>

                </section>

            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
